<style>
/* Layout: full-screen pond. Thin HUD floats over the sky, the pond scrolls sideways under it. Single committed storybook look; the sky itself moves from morning to night as you go further. */
:root{
  --leaf:#3fae4f; --leaf-deep:#1f6b2e; --lotus:#ff7fa8; --sun:#ffc93c;
  --ink:#16302a; --paper:#fffaf0; --chili:#e8553e;
  --display:"Baloo 2","Mukta",system-ui,sans-serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:#8fd3f4;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;width:100%;margin:0 auto;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage canvas{transition:filter .9s}
#app:has(#startOv:not([hidden])) #stage canvas{filter:saturate(1.35) contrast(1.07)}
.hud .scorebox,.hud .lbl,.hud .rec,.hud .hearts,.hud .right,.hud .val{transition:all .5s ease}
#app.hudmin .scorebox{background:transparent;box-shadow:none}
#app.hudmin .lbl,#app.hudmin .rec .bar,#app.hudmin .hearts{opacity:0;max-height:0;overflow:hidden;margin:0}
#app.hudmin .rec{margin-top:-2px}#app.hudmin #recTxt{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:13px}
#app.hudmin .val{color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.45)}
#app.hudmin .right{opacity:.35}
.hud{position:absolute;top:8px;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:3}
.scorebox{background:var(--paper);border-radius:18px;padding:4px 12px 7px;box-shadow:0 3px 0 #0002;display:flex;flex-direction:column;align-items:stretch;width:fit-content}
.chip{width:fit-content;display:flex;align-items:baseline;gap:8px}
.chip .lbl{font-size:13px;color:#4c6b5e;font-weight:600}
.chip .val{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;color:var(--leaf-deep);font-variant-numeric:tabular-nums}
.combo{font-family:var(--display);font-weight:800;font-size:15px;padding:1px 8px;border-radius:999px;background:var(--sun);color:#5a3a00}
.right{display:flex;gap:8px;align-items:center;pointer-events:auto}
.best{background:var(--paper);border-radius:12px;padding:3px 10px 1px;font-size:12px;color:#4c6b5e;text-align:center;line-height:1.1;box-shadow:0 3px 0 #0002}
.best b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.mute{background:transparent;box-shadow:none!important;color:#fff!important;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));border:0;border-radius:12px;height:42px;width:46px;padding:0;display:inline-flex;align-items:center;justify-content:center;font:600 13px var(--body);color:#4c6b5e;box-shadow:0 3px 0 #0002;cursor:pointer}
.mute:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.rec{display:flex;width:auto;align-items:center;gap:6px;margin-top:2px;font-size:12px;font-weight:600;color:var(--ink);background:none;box-shadow:none!important;padding:0!important;border-radius:999px;padding:3px 10px 2px;box-shadow:0 2px 0 #0002}
.rec .bar{width:56px;height:7px;border-radius:9px;background:#d9e8e0;overflow:hidden;box-shadow:0 1px 0 #0002}
.rec .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd21f,#ff4f9a);border-radius:9px;transition:width .4s}
.hearts{display:flex;gap:2px;margin-top:0;margin-left:8px;align-self:center;line-height:1;filter:drop-shadow(0 1px 0 #0003)}
.hearts span{color:#ff8a1f;display:inline-flex}.hearts span.off{color:#c9d6d0;opacity:.8}.hearts svg{width:21px;height:15px}
@keyframes hb{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}.hearts span.pulse{animation:hb .5s ease}
.banner{position:absolute;top:96px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 18px 3px;font-family:var(--display);font-weight:800;font-size:19px;white-space:nowrap;box-shadow:0 4px 0 #0003;z-index:4;pointer-events:none;animation:ban 2.4s ease forwards}
.banner small{font-family:var(--body);font-weight:600;font-size:13px;color:#d0347a;margin-left:6px}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-12px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.hint{display:none;position:absolute;left:0;right:0;bottom:18px;text-align:center;font-weight:600;font-size:16px;color:#fff;text-shadow:0 2px 0 #0005;pointer-events:none;z-index:3;padding-inline:16px}
.pop{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(28px,9vw,44px);color:#fff;text-shadow:0 3px 0 #0006,0 0 18px #0003;pointer-events:none;z-index:4;animation:pop .9s ease-out forwards}
.pop small{display:block;font-size:20px;color:var(--sun)}
@keyframes pop{0%{transform:scale(.5);opacity:0}15%{transform:scale(1.1);opacity:1}30%{transform:scale(1)}75%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:transparent;z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(135deg,#ff3d6e,#ff8a1f,#ffd21f,#2ee05a,#1fb4ff,#b46bff) border-box;border:6px solid transparent;border-radius:28px;padding:18px 20px 22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 8px 0 #0003}
.card canvas{position:static;width:112px;height:131px;margin-bottom:-6px}
.card h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,60px);line-height:1.3;margin:0;padding:.06em .1em .2em;margin-bottom:-.22em;color:#ff8a1f;background:linear-gradient(90deg,#ff3d6e,#ff8a1f 35%,#ffb21f 55%,#2ebf5a 80%,#1fa4ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-wrap:balance;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.card h2{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;margin:0;color:#2a8fc4}
.card p{margin:0;font-size:17px;line-height:1.5}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left;font-size:16px;line-height:1.4}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:6px}
.card h1 .tm{font-size:.32em;vertical-align:top;margin-left:2px;-webkit-text-fill-color:#2ebf5a;font-family:var(--body)}
.card .inst{font-family:inherit;font-weight:800;font-size:17px;color:#fff;border:0;border-radius:999px;padding:9px 20px 7px;background:linear-gradient(180deg,#3aa0ff,#1f5fe0);box-shadow:0 3px 0 #133f9e;cursor:pointer}
.card .insthelp{font-size:14px;color:#333;background:#fff6c8;border-radius:12px;padding:6px 10px;line-height:1.4}
.card .fb{font-weight:700;font-size:15px;color:#fff;text-decoration:none;border:0;border-radius:999px;padding:6px 16px 4px;background:linear-gradient(180deg,#2ee06a,#12a84a);box-shadow:0 3px 0 #0b7a34}
.langsw{display:flex;gap:0;border-radius:999px;background:#eef3f0;padding:3px;box-shadow:inset 0 1px 2px #0002;margin-bottom:-4px}
.langsw button{font:700 14px var(--body);border:0;background:transparent;color:#4c6b5e;padding:5px 14px 4px;border-radius:999px;cursor:pointer}
.langsw button.on{background:linear-gradient(180deg,#8a5cff,#5a2fd8);color:#fff;box-shadow:0 2px 0 #3a1fa0}
.card .bestline{font-weight:700;font-size:16px;color:#d0347a;margin:-2px 0 -4px}
.card .credit{margin:2px 0 -6px;font-size:13px;color:#6a8a7c;font-weight:600;letter-spacing:.02em}
.rules li:nth-child(1) b{color:#ff3d6e}.rules li:nth-child(2) b{color:#ff8a1f}.rules li:nth-child(3) b{color:#1fa4ff}
.rules b{font-family:var(--display);color:var(--leaf);font-size:19px;line-height:1.2}
.stats{display:flex;gap:26px;justify-content:center}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:#4c6b5e}
.btn{font-family:var(--display);font-weight:800;font-size:23px;background:linear-gradient(180deg,#ff7a00,#ff1f5a);color:#fff;border:0;border-radius:16px;padding:12px 32px 8px;cursor:pointer;box-shadow:0 5px 0 #b0103e;text-shadow:0 2px 0 #0003}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b0103e}
.newbest{color:#d0347a;font-weight:600}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s;animation-fill-mode:none}}
</style>

</head>

<div id="app">

  <div class="hud">

<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('cv'),stage=$('stage');let ctx=cv.getContext('2d');
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
let best=parseInt(store('frog_best')||'0',10)||0, muted=store('frog_muted')==='1';
$('best').textContent=best;
function muteIcon(){$('mute').innerHTML='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>'+(muted?'<path d="M17 9l5 6M22 9l-5 6" stroke="#e8283c"/>':'<path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/>')+'</svg>';$('mute').setAttribute('aria-label',muted?'आवाज़ चालू करें':'आवाज़ बंद करें')}
muteIcon();

let W=360,H=640,s=1,waterY=400,frogX0=100;
function resize(){
  const r=stage.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,r.width);H=Math.max(300,r.height);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const so=s;
  s=Math.max(0.8,Math.min(1.6,Math.min(W/380,H/620)));
  waterY=H*(W>H?0.58:0.6);frogX0=W*(W>H?0.22:0.26);
  if(typeof pads!=='undefined'&&pads.length&&Math.abs(s-so)>.001){const f=s/so;
    pads.forEach(q=>{q.bx*=f;q.r*=f;q.amp*=f});deco.forEach(d=>d.x*=f);camX*=f;frog.x*=f;if(frog.padOff)frog.padOff*=f;
    if(frog.fly){frog.fly.sx*=f;frog.fly.tx*=f;frog.fly.h*=f}swim.length=0;birds.length=0;bflies.length=0;flies.length=0;fish=null;peek.length=0}
}
window.addEventListener('resize',resize);

/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
const PAL=[ // sunrise, morning, evening, night
  {sky1:'#3a2fd8',sky2:'#ff4f8a',sky3:'#ffb000',hill1:'#7fe03a',hill2:'#14c850',water1:'#ff8ac0',water2:'#4a3fe0',sun:'#ff9a00',nt:0,dy:.6,sy:.66,sr:1.45,ray:1},
  {sky1:'#0086ff',sky2:'#3fd2ff',sky3:'#ffe85a',hill1:'#5ef04a',hill2:'#10d050',water1:'#00e6e0',water2:'#0060f0',sun:'#ffd800',nt:0,dy:1,sy:.28,sr:1,ray:0},
  {sky1:'#8a46ff',sky2:'#ff66a8',sky3:'#ffd23a',hill1:'#ee6fc4',hill2:'#9a4ce0',water1:'#ff7cc8',water2:'#5a46e0',sun:'#ffb21f',nt:0,dy:0,sy:.4,sr:1.15,ray:.3},
  {sky1:'#1a0f66',sky2:'#3f2fb8',sky3:'#9a4fd8',hill1:'#4458c8',hill2:'#2a3290',water1:'#2f5ad0',water2:'#18207a',sun:'#fff6c8',nt:1,dy:0,sy:.28,sr:1,ray:0}
];
function palette(n){
  const N=PAL.length,p=(n%(20*N))/20; const i=Math.floor(p),t=reduce?Math.round(p-i):clamp((p-i-0.6)/0.4,0,1);
  const a=PAL[i%N],b=PAL[(i+1)%N],o={};for(const k in a)o[k]=typeof a[k]==='number'?a[k]+(b[k]-a[k])*t:mix(a[k],b[k],t);
  o.night=o.nt;o.day=o.dy;return o;
}

/* ---------- state ---------- */
let state='start',score=0,perfects=0,streak=0,clock=0,stateT=0;
let pads=[],cur=0,camX=0,camTarget=0;
let charge=0,charging=false,jumps=0;
let frog={x:0,y:0,squash:0,mood:'idle',blink:0,fly:null,face:1,hopAnim:0};
const parts=[],ripples=[],deco=[];
let hinted=store('frog_hinted')==='1',eyeK=1,eyePop=0,padsN=0,peek=[],peekCD=2,practice=parseInt(store('frog_practice')||'0',10)||0,missRow=0,helpJ=0,flies=[],bflies=[],fish=null,swim=[],cheerT=0,sadT=0,cheerWord='वाह!',cheerPts=0,birds=[],outfit=0,good=0;
const CLOUDS=[{x0:.05,y:.13,sz:1.1,v:16,par:.05,c:'#ffd6ec'},{x0:.55,y:.22,sz:.8,v:-18,par:.03,c:'#e2d6ff'},{x0:.32,y:.36,sz:.65,v:-12,par:.02,c:'#fff0b8'},{x0:.8,y:.09,sz:.75,v:10,par:.04,c:'#cdeeff'},{x0:.95,y:.3,sz:1,v:-14,par:.03,c:'#ffffff'},{x0:.18,y:.5,sz:.55,v:20,par:.06,c:'#ffd8c4'},{x0:.66,y:.44,sz:.7,v:13,par:.05,c:'#d6ffe4'}];

function scheduleMusic(){
  if(!ac)return;
  const spb=60/84/2;
  if(sqHush>0){nextNote=Math.max(nextNote,ac.currentTime+.1);return}
  while(nextNote<ac.currentTime+.25){
    const st=step%32,bar=Math.floor(st/8),root=BASS[bar];
    if(st%8===0)pluck(hz(root,-1),nextNote,.06,2);
    if(st%8===4)pluck(hz(root+2,-1),nextNote,.04,1.4);
    if([1,0,1,1,0,1,0,1][st%8]&&Math.random()<.7){walk=clamp(walk+[-1,1,1,-1,2,-2][Math.floor(Math.random()*6)],0,7);pluck(hz(walk,1),nextNote,.025,.8)}
    nextNote+=spb;step++;
  }
}
function startMusic(){if(!ac||musicTimer)return;nextNote=ac.currentTime+.15;musicTimer=setInterval(scheduleMusic,70)}

    ctx.strokeStyle=mix('#1f9a3a','#141c48',nm);ctx.lineWidth=2*s;ctx.beginPath();ctx.moveTo(x,y+14*s);ctx.quadraticCurveTo(x,y+6*s,x+sw,y);ctx.stroke();
    ctx.fillStyle=mix('#2fd14a','#141c48',nm);ctx.beginPath();ctx.ellipse(x+4*s,y+9*s,4*s,1.8*s,-.5,0,7);ctx.fill();
    const fx=x+sw,c=FLOWERS[Math.floor(hsh(k+5)*FLOWERS.length)];
    if(t<.2){ctx.fillStyle='#ff2e3d';ctx.beginPath();ctx.ellipse(fx,y+6*s,9*s,6*s,0,Math.PI,0);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(fx-2*s,y+6*s,4*s,8*s);ctx.beginPath();ctx.arc(fx-4*s,y+2*s,1.6*s,0,7);ctx.arc(fx+3*s,y+1*s,1.4*s,0,7);ctx.fill()}
    else if(t<.55){ctx.fillStyle=c;for(let a=0;a<6;a++){ctx.beginPath();ctx.ellipse(fx+Math.cos(a*1.047)*4.2*s,y+Math.sin(a*1.047)*4.2*s,3.4*s,2.4*s,a*1.047,0,7);ctx.fill()}ctx.fillStyle='#ffd21f';ctx.beginPath();ctx.arc(fx,y,2.8*s,0,7);ctx.fill();ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.arc(fx+.6*s,y+.6*s,1.2*s,0,7);ctx.fill()}
    else if(t<.8){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(fx-5*s,y-6*s);ctx.lineTo(fx-2.5*s,y-1*s);ctx.lineTo(fx,y-7*s);ctx.lineTo(fx+2.5*s,y-1*s);ctx.lineTo(fx+5*s,y-6*s);ctx.quadraticCurveTo(fx+5*s,y+4*s,fx,y+4*s);ctx.quadraticCurveTo(fx-5*s,y+4*s,fx-5*s,y-6*s);ctx.fill()}
    else{ctx.fillStyle='#ffc21f';for(let a=0;a<10;a++){ctx.beginPath();ctx.ellipse(fx+Math.cos(a*.628)*5.5*s,y+Math.sin(a*.628)*5.5*s,3*s,1.6*s,a*.628,0,7);ctx.fill()}ctx.fillStyle='#7a4a1f';ctx.beginPath();ctx.arc(fx,y,3.4*s,0,7);ctx.fill()}}
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);ctx.clearRect(0,0,W,H);draw();
  if(!$('startOv').hidden){try{drawLogo(dt)}catch(e){}}
  requestAnimationFrame(frame);
}

/* logo frog on start card */
function drawSac(x,y,R,u,txt){const k=Math.sin(Math.min(1,u)*Math.PI);if(k<=0)return;
  ctx.fillStyle='#ffe9a0';ctx.strokeStyle='#e8a020';ctx.lineWidth=Math.max(1,R*.05);
  ctx.beginPath();ctx.ellipse(x,y-R*.4,R*(.18+.3*k),R*(.12+.22*k),0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(x-R*.12*k,y-R*.48,R*.1*k,R*.05*k,-.3,0,7);ctx.fill();
  if(txt){ctx.save();ctx.globalAlpha=Math.min(1,k*1.6);ctx.font='800 '+Math.round(R*.42)+'px "Baloo 2","Mukta",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.lineWidth=R*.1;ctx.strokeStyle='#fff';ctx.fillStyle='#d0347a';const ty=y-R*1.9-u*R*.4;ctx.strokeText(txt,x+R*.75,ty);ctx.fillText(txt,x+R*.75,ty);ctx.restore()}}
let logoT=0,logoCroak=[false,false];
function drawLogo(dt){
  const lc=$('logo');if(!lc)return;const l=lc.getContext('2d');logoT=(logoT+(dt||0))%2.6;const t=logoT;
  l.clearRect(0,0,240,280);const real=ctx;ctxSwap(l);
  const R=56,gx=110,gy=266;let y=gy,sq=0,mood='happy',legs=0;
  if(t<.35){sq=.55*Math.sin(t/.35*Math.PI/2);mood='charge'}
  else if(t<.9){const u=(t-.35)/.55;y=gy-Math.sin(u*Math.PI)*84;mood='fly';legs=Math.sin(u*Math.PI)}
  else if(t<1.05){sq=.4*Math.sin((t-.9)/.15*Math.PI)}
  l.fillStyle='rgba(0,60,40,.18)';l.beginPath();l.ellipse(gx,gy+2,R*(1-(gy-y)/220),R*.2,0,0,7);l.fill();
  drawFrog(gx,y,sq,mood,legs,R,false,0);
  [[1.25,0],[1.85,1]].forEach(([c,i])=>{const u=(t-c)/.4;if(u>=0&&u<=1){drawSac(gx,y,R,u,T('croak'));if(!logoCroak[i]){logoCroak[i]=true;sfx('croak')}}else if(t<c)logoCroak[i]=false});
  ctxSwap(real);
}
let ctxRef=ctx;function ctxSwap(c){ctx=c}

resize();reset();state='start';
try{drawLogo(0)}catch(e){}
$('startOv').addEventListener('pointerdown',()=>ensureAudio());
requestAnimationFrame(frame);
setTimeout(()=>$('startBtn').focus(),100);
})();
</script>
